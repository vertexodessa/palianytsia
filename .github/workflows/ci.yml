name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libavcodec-dev libavutil-dev libswscale-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Docs match the tree
        run: tools/doc-check.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: M1 capture replay
        # Captures live outside git; without them the script exits 77
        # (skipped), which is a notice here, not a failure.
        run: |
          rc=0; tools/m1-replay.sh || rc=$?
          if [ "$rc" = 77 ]; then echo "::notice::M1 skipped: no captures on the runner"
          elif [ "$rc" != 0 ]; then exit "$rc"; fi
      - name: M0 parity (pal-ref vs webgs replay)
        run: tools/m0-parity.sh
      - name: Drone installer against fake drones
        run: python3 tools/tests/drone_install_test.py

  maburd:
    # Two independent builds of the same commit; the compare job below
    # requires byte-identical binaries.
    strategy:
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake bzip2
      - name: Build maburd (pinned OpenIPC toolchain, sha256-checked)
        run: PAL_FETCH_TOOLCHAIN=1 tools/build-maburd.sh "${GITHUB_SHA::8}"
      - uses: actions/upload-artifact@v7
        with:
          name: maburd-${{ matrix.run }}
          path: dist/

  maburd-reproducible:
    needs: maburd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
      - name: Compare the two builds
        run: |
          set -e
          a=$(sha256sum maburd-a/maburd-* | cut -d' ' -f1)
          b=$(sha256sum maburd-b/maburd-* | cut -d' ' -f1)
          echo "run a: $a"; echo "run b: $b"
          cat maburd-a/PAIR.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$a" = "$b" ] || { echo "maburd is not reproducible"; exit 1; }

  aarch64-qemu:
    # The phone and the Quest decode FEC with the NEON GF(256) kernel
    # (pal-fec gf256::neon); every x86 job takes the scalar path, so these
    # tests run the aarch64 build under qemu-user. Pure Rust crates only: no
    # target sysroot beyond libc is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cross packages
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: pal-fec, pal-wire, pal-core tests on aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test --locked -p pal-fec -p pal-wire -p pal-core --target aarch64-unknown-linux-gnu

[package]
name = "pal-desktop"
description = "Native Linux ground station: devourer card or capture replay, libavcodec decode, egui OSD"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pal-desktop"
path = "src/main.rs"

[dependencies]
pal-core.workspace = true
pal-wire.workspace = true
pal-ref = { workspace = true, features = ["live"] }
devourer-sys.workspace = true
flightlog.workspace = true
decode.workspace = true
pal-osd = { workspace = true, features = ["ui"] }
runtime.workspace = true
eframe.workspace = true
egui.workspace = true

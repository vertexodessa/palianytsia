plugins {
    id "com.android.application"
}

android {
    namespace "org.palianytsia.phone"
    compileSdk 34
    defaultConfig {
        applicationId "org.palianytsia.phone"
        // Spec 5.5: ASurfaceControl and the MediaCodec low-latency keys.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.0.1"
        ndk { abiFilters "arm64-v8a" }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The native library is built by cargo (tools/phone-apk.sh), not here.
    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}

[package]
name = "pal-phone"
description = "Phone app native side: JNI start/stop/stats over the shared runtime, MediaCodec into the app's Surface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "palphone"
crate-type = ["cdylib", "rlib"]

# Host builds compile an empty library so the workspace gates stay
# platform-neutral; everything real is Android-only.
[target.'cfg(target_os = "android")'.dependencies]
pal-core.workspace = true
pal-osd.workspace = true
runtime.workspace = true
devourer-sys.workspace = true
decode.workspace = true
jni = "0.21"
ndk = { version = "0.9", features = ["media", "api-level-29"] }
android_logger = "0.14"
log = "0.4"

[package]
name = "pal-phone"
description = "Phone app native side: JNI start/stop/stats over the shared runtime, MediaCodec into the app's Surface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "palphone"
crate-type = ["cdylib", "rlib"]

# Host builds compile an empty library so the workspace gates stay
# platform-neutral; everything real is Android-only.
[target.'cfg(target_os = "android")'.dependencies]
pal-osd = { workspace = true, features = ["ui"] }
runtime.workspace = true
pal-android = { path = "../../../crates/pal-android" }
jni = "0.21"
ndk = { version = "0.9", features = ["media", "api-level-29"] }
android_logger = "0.14"
log = "0.4"
egui = { workspace = true }
egui_glow = "0.31"
glow = "0.16"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }

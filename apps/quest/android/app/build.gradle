plugins {
    id "com.android.application"
}

android {
    namespace "org.palianytsia.quest"
    compileSdk 34
    defaultConfig {
        applicationId "org.palianytsia.quest"
        // Quest 3 runs Android 12L+; the surface swapchain path was proven
        // on API 32 (spikes/quest-xr-probe).
        minSdk 32
        targetSdk 32
        versionCode 10
        versionName "0.8.0"
        ndk { abiFilters "arm64-v8a" }
    }
    // Release signing from a properties file outside the repo (storeFile,
    // storePassword, keyAlias, keyPassword): $PAL_SIGNING, else
    // ~/.config/palianytsia/release-signing.properties. Without it the
    // release APK comes out unsigned, never debug-signed.
    def signing = file(System.getenv("PAL_SIGNING") ?:
            "${System.getProperty('user.home')}/.config/palianytsia/release-signing.properties")
    signingConfigs {
        release {
            if (signing.exists()) {
                def p = new Properties()
                signing.withInputStream { p.load(it) }
                storeFile file(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signing.exists()) signingConfig signingConfigs.release
        }
    }
    // libpalquest is built by cargo (tools/quest-apk.sh), not here.
    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}


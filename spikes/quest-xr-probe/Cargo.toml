[package]
name = "quest-xr-probe"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
openxr = { version = "0.19", features = ["loaded"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk-context = "0.1"
log = "0.4"
ndk = { version = "0.9", features = ["media", "api-level-30"] }
jni = "0.21"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
android_logger = "0.14"

[workspace]

[package.metadata.android]
package = "org.palianytsia.xrprobe"
build_targets = ["aarch64-linux-android"]
runtime_libs = "libs"
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 32
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[package.metadata.android.application]
label = "palxr probe"
debuggable = true

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "quest_xr_probe"

[[package.metadata.android.application.activity.meta_data]]
name = "android.hardware.usb.action.USB_DEVICE_ATTACHED"
resource = "@xml/device_filter"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.hardware.usb.action.USB_DEVICE_ATTACHED"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["com.oculus.intent.category.VR", "android.intent.category.LAUNCHER"]

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "quest3|quest2|questpro"

# Spike only: the Android debug key. Release builds of the real app sign with their own key.
[package.metadata.android.signing.release]
path = "/home/ihor/.android/debug.keystore"
keystore_password = "android"

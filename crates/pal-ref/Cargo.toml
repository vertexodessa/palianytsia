[package]
name = "pal-ref"
description = "mabur's C++ WebGs behind the GsCore trait: the test oracle, and (feature live) mabur's channel core on a live card"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "pal_ref"

[dependencies]
pal-core.workspace = true
runtime = { workspace = true, optional = true }
devourer-sys = { workspace = true, optional = true }
pal-wire = { workspace = true, optional = true }

[features]
# The glue that hands a live devourer-sys card to the C++ core
# (runtime::Attach): pal-desktop.
live = ["dep:runtime", "dep:devourer-sys", "dep:pal-wire"]

[dev-dependencies]
pal-core = { workspace = true, features = ["fake"] }
pal-wire.workspace = true

[build-dependencies]
cmake = "0.1"
cc = "1"

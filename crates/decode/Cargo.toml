[package]
name = "decode"
description = "Video decode backends: libavcodec HEVC on Linux (low delay, slice threads)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "avcodec"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "api-level-29"] }
# The media format key names as libmediandk exports them.
ndk-sys = { version = "0.6", features = ["media"] }
log = "0.4"

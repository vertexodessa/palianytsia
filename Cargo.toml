[workspace]
resolver = "2"
members = ["crates/pal-wire", "crates/pal-core", "crates/pal-ref", "crates/devourer-sys", "crates/flightlog", "crates/pal-fec", "crates/hevc", "crates/decode", "crates/pal-osd", "crates/runtime", "crates/pal-build", "crates/pal-android", "apps/pal", "apps/desktop", "apps/phone/rust", "apps/quest/rust"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
pal-wire = { path = "crates/pal-wire" }
pal-core = { path = "crates/pal-core" }
pal-ref = { path = "crates/pal-ref" }
devourer-sys = { path = "crates/devourer-sys" }
flightlog = { path = "crates/flightlog" }
runtime = { path = "crates/runtime" }
pal-fec = { path = "crates/pal-fec" }
hevc = { path = "crates/hevc" }
decode = { path = "crates/decode" }
serde_json = "1"
libc = "0.2"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
pal-osd = { path = "crates/pal-osd", default-features = false }
pal-build = { path = "crates/pal-build" }

# Real-time video stays usable in debug builds.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace]
resolver = "2"
members = ["crates/pal-wire", "crates/pal-core", "crates/pal-ref", "crates/devourer-sys", "crates/flightlog", "crates/pal-fec", "crates/hevc", "apps/pal"]
# Android-only spikes build with their own target; keep them out of host builds.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
pal-wire = { path = "crates/pal-wire" }
pal-core = { path = "crates/pal-core" }
pal-ref = { path = "crates/pal-ref" }
devourer-sys = { path = "crates/devourer-sys" }
flightlog = { path = "crates/flightlog" }
pal-fec = { path = "crates/pal-fec" }
hevc = { path = "crates/hevc" }
serde_json = "1"

# Real-time video stays usable in debug builds.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
